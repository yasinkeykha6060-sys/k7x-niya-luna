name: Moon journal

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: moon-journal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Listen
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          HOME_USERNAME: ${{ secrets.HOME_USERNAME }}
          WATCH_SECONDS: "16800"
          AUTO_PUSH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node src/index.js

      - name: Save the journal
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/state.enc ]; then
            git add -- data/state.enc
            if ! git diff --cached --quiet; then
              git commit -m "Update journal"
            fi
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" != "0" ]; then
            git push origin HEAD:main
          else
            echo "Journal is already on GitHub."
          fi

      - name: Hand off to the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run bot.yml --ref main; then
              exit 0
            fi
            echo "Handoff attempt $attempt did not start the next run."
            sleep 15
          done
          exit 1
